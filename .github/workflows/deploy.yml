name: Check and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Resolve public site URL and repository base
        id: site
        run: node tools/deployment.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.site }}
          BASE_PATH: ${{ steps.site.outputs.base }}
      - run: npm run check:dist
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish static website
        id: deployment
        uses: actions/deploy-pages@v5
